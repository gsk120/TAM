name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deployment is intentionally inert until this repository variable is set to true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        run: >-
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}"
          --source .
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --platform managed
          --allow-unauthenticated
          --set-secrets "DATABASE_URL=${{ vars.DATABASE_URL_SECRET_NAME }}:latest,JWT_SECRET=${{ vars.JWT_SECRET_NAME }}:latest"
